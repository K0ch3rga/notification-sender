<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push service</title>
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> -->
  <style>
    :root {
      --distance: 10px;
      --radius: 16px;
    }

    body,
    html {
      margin: 0;
      height: 100svh;
      width: 100svw;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: row;
      box-sizing: border-box;
      justify-content: stretch;
    }

    .panel {
      border-radius: var(--radius);
      border: black 1px solid;
      flex-grow: 1;
      flex-shrink: 0;
    }

    .panel.left {}

    .panel.right {}

    .separator {
      width: 2px;
      border-radius: var(--radius);
      background-color: blue;
      border: white 1px solid;
      cursor: col-resize;
    }

    .separator:hover {
      border: blue 1px solid
    }
  </style>

</head>

<body>
  <div class="notifications left panel" id="leftSide">

  </div>
  <div class="separator" id="separator"></div>
  <div class="send right panel" id="rightSide">

  </div>
  <!-- <form method="post">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    <button type="submit">Войти</button>
  </form> -->
</body>

<script>
  const separator = document.getElementById('separator');
  const leftDiv = document.getElementById('leftSide');
  const rightDiv = document.getElementById('rightSide');

  let isResizing = false;

  separator.addEventListener('mousedown', (e) => {
    isResizing = true;
    // Add mousemove and mouseup event listeners
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
  });

  function handleMouseMove(e) {
    if (!isResizing) return;

    const containerRect = separator.parentElement.getBoundingClientRect();

    // Calculate new widths based on mouse position
    const leftWidth = e.clientX - containerRect.left;
    const rightWidth = containerRect.width - leftWidth - separator.offsetWidth;

    // Ensure minimum widths for both divs
    if (leftWidth > 50 && rightWidth > 50) {
      leftDiv.style.width = `${leftWidth}px`;
      rightDiv.style.width = `${rightWidth}px`;
    }
  }

  function handleMouseUp() {
    isResizing = false;

    // Remove mousemove and mouseup event listeners
    document.removeEventListener('mousemove', handleMouseMove);
    document.removeEventListener('mouseup', handleMouseUp);
  }
</script>

</html>
